
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e5f8ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            width: 80%;
            max-width: 700px;
            padding: 30px;
            border: 3px solid #064e46;
            border-radius: 12px;
            text-align: center;
            background-color: #f8fffb;
            box-shadow: 0 5px 20px #b7d8cd;
        }

        h1 {
            color: #064e46;
            font-size: 40px;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            padding: 18px;
            margin: 10px 0;
            font-size: 18px;
            border: 2px solid #5c9185;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .buttons {
            margin: 25px 0;
        }

        button {
            width: 65px;
            height: 60px;
            margin: 5px;
            font-size: 25px;
            font-weight: bold;
            color: #064e46;
            background-color: #d1fae5;
            border: 2px solid #064e46;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #a7f3d0;
        }

        h2 {
            color: #064e46;
            font-size: 30px;
        }

        #result {
            width: 90%;
            min-height: 25px;
            margin: 0 auto;
            padding: 18px;
            border: 2px solid #5c9185;
            border-radius: 8px;
            font-size: 22px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <input
            type="number"
            id="num1"
            placeholder="Enter first number"
            step="any"
        >

        <input
            type="number"
            id="num2"
            placeholder="Enter second number"
            step="any"
        >

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">*</button>
            <button onclick="calculate('/')">/</button>
        </div>

        <h2>Result</h2>

        <div id="result" aria-live="polite"></div>

    </div>

    <script>
        function calculate(operator) {

            // Get values from input fields
            const first = document.getElementById("num1").value;
            const second = document.getElementById("num2").value;

            // Check whether both numbers are entered
            if (first.trim() === "" || second.trim() === "") {
                document.getElementById("result").textContent =
                    "Please enter both numbers!";
                return;
            }

            // Convert input values into numbers
            const a = Number(first);
            const b = Number(second);

            let answer;

            // Perform the selected operation
            if (operator === '+') {
                answer = a + b;
            }
            else if (operator === '-') {
                answer = a - b;
            }
            else if (operator === '*') {
                answer = a * b;
            }
            else if (operator === '/') {

                if (b === 0) {
                    document.getElementById("result").textContent =
                        "Cannot divide by zero!";
                    return;
                }

                answer = a / b;
            }

            // Display the answer
            document.getElementById("result").textContent = answer;
        }
    </script>

</body>
</html>
